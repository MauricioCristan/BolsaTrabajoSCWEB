<div class="container py-5" style="max-width:600px">
  <h2 class="mb-4">Registro de Empresa - Santa Catarina</h2>
  <p class="text-muted">Registra tu negocio y publica vacantes. El municipio verificará tu empresa en 24h.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" class="card p-4 shadow-sm">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Usuario *</label><input class="form-control" formControlName="username"></div>
      <div class="col-md-6"><label class="form-label">Contraseña *</label><input type="password" class="form-control" formControlName="password"></div>
      <div class="col-12"><label class="form-label">Email</label><input class="form-control" formControlName="email"></div>
      <div class="col-12"><label class="form-label">Nombre comercial *</label><input class="form-control" formControlName="nombre"></div>
      <div class="col-md-6"><label class="form-label">RFC *</label><input class="form-control" formControlName="rfc" placeholder="XAXX010101000"><small class="text-muted">Formato SAT</small></div>
      <div class="col-md-6"><label class="form-label">Colonia *</label><input class="form-control" formControlName="colonia"></div>
      <div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" formControlName="telefono"></div>
      <div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" formControlName="descripcion" rows="2"></textarea></div>
    </div>
    <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{errorMsg}}</div>
    <button class="btn btn-primary w-100 mt-4" [disabled]="loading">{{loading ? 'Registrando...' : 'Registrar empresa'}}</button>
    <a routerLink="/login" class="d-block text-center mt-3">¿Ya tienes cuenta? Inicia sesión</a>
  </form>
</div>
